name: gestutalk
description: "GestuTalk - Real-time AI sign language bidirectional translation application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^14.2.0

  # UI & Typography
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Hardware, Permissions & Media
  camera: ^0.10.5+9
  permission_handler: ^11.3.1

  # Local Persistence
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

